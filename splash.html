<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | HLTHY</title>

  <!-- Auto-redirect to home.html after 4 seconds (HTML meta refresh) -->
  <meta http-equiv="refresh" content="4; url=home.html" id="meta-refresh" />

  <style>
    /* Splash uses its own full-screen style — does NOT use the shared template */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-primary:      #2E7D6E;
      --clr-primary-dark: #1B5E50;
      --clr-secondary:    #F4A261;
      --clr-white:        #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: var(--clr-primary-dark);
      color: var(--clr-white);
      text-align: center;
    }

    /* Full-screen background image with overlay */
    .bg {
      position: absolute;
      inset: 0;
      background-image: url('images/splash_bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(27, 94, 80, 0.78);
    }

    /* All content above the overlay */
    .splash-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 2rem;
      max-width: 640px;
    }

    .sdg-badge {
      background: var(--clr-secondary);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.3rem 1rem;
      border-radius: 20px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    h1 span { color: var(--clr-secondary); }

    .mission {
      font-size: 1.05rem;
      opacity: 0.88;
      max-width: 480px;
      line-height: 1.6;
    }

    /* Team member names */
    .team-names {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.4rem;
    }
    .team-names span {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.85rem;
    }

    /* CSS loader animation */
    .loader {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }
    .loader-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--clr-secondary);
      animation: bounce 0.8s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.15s; }
    .loader-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1.2); opacity: 1;   }
    }

    /* Countdown display */
    #countdown-text {
      font-size: 1rem;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
    #countdown-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--clr-secondary);
      display: block;
      line-height: 1;
    }

    /* Skip button */
    .skip-btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.65rem 1.8rem;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.7);
      color: #fff;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.25s ease, border-color 0.25s ease;
      text-decoration: none;
    }
    .skip-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: #fff;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Background image layer -->
  <div class="bg" role="img" aria-label="Background: healthcare workers and patients in a vibrant clinic setting"></div>

  <!-- Main content -->
  <div class="splash-content">

    <span class="sdg-badge">Sustainable Development Goal 3</span>

    <h1>Good <span>Health</span><br /> &amp; Well-being</h1>

    <p class="mission">
      Empowering students, communities, and individuals to take real action for better health outcomes for everyone, everywhere.
    </p>

    <!-- Group members -->
    <div>
      <p style="font-size:0.8rem; opacity:0.7; margin-bottom:0.5rem; letter-spacing:0.5px; text-transform:uppercase;">Our Team</p>
      <div class="team-names">
        <span>Mohamed Anshaf</span>
        <span>Mohamed Zamz Jaheed</span>
        <span>M.Thrishan</span>
        <span>S.Shanheeshan</span>
      </div>
    </div>

    <!-- CSS Loader animation -->
    <div class="loader" aria-hidden="true">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>

    <!-- Countdown (updated by JavaScript) -->
    <div id="countdown-text">
      Entering site in
      <span id="countdown-num">4</span>
      seconds
    </div>

    <!-- Skip button -->
    <a href="home.html" class="skip-btn" id="skip-btn" role="button">
      Skip Intro →
    </a>

  </div>

  <!--
       SPLASH JAVASCRIPT
       1. Countdown timer
       2. Cancel auto-redirect if Skip is clicked-->
       
  <script>
    let timeLeft = 4;
    const countdownNum = document.getElementById('countdown-num');
    const skipBtn      = document.getElementById('skip-btn');

    // Track whether the user has skipped
    let skipped = false;

    // Update countdown every second
    const timer = setInterval(() => {
      if (skipped) { clearInterval(timer); return; }
      timeLeft--;
      countdownNum.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = 'home.html';
      }
    }, 1000);

    // Skip button: navigate immediately AND cancel the countdown
    skipBtn.addEventListener('click', (e) => {
      e.preventDefault();   // Prevent default link navigation
      skipped = true;
      clearInterval(timer);

      // Also disable the meta refresh by removing it from the head
      const metaRefresh = document.getElementById('meta-refresh');
      if (metaRefresh) metaRefresh.remove();

      // Navigate manually
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
